<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelame ésta - El Juego de Plastilina</title>
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #ba181b;
            --secondary: #457b9d;
            --accent: #ffb703;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #f1faee;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #0f3460;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8d99ae;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #e0e0e0;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #0f3460;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        .prompt-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f3460;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        .prompt-box span {
            font-size: 0.9rem;
            color: #8d99ae;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .prompt-text {
            font-size: 2.3rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 900;
            font-family: monospace;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .timer-display.warning {
            color: var(--primary);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent);
            transition: width 1s linear, background-color 0.3s;
        }

        .progress-bar.warning {
            background: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #3a6b88;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #ccc;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        .hidden {
            display: none !important;
        }

        .audio-test-btn {
            background: transparent;
            color: #8d99ae;
            border: none;
            font-size: 0.8rem;
            text-decoration: underline;
            margin-top: 15px;
            cursor: pointer;
        }

        .vote-notice {
            background: #2a9d8f;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Modelame ésta</h1>
        <p class="subtitle">¡Edición Cumpleaños de El Monch! 🎂</p>

        <!-- PANTALLA DE CONFIGURACIÓN -->
        <div id="setup-screen" class="card">
            <div class="selector-group">
                <div>
                    <label for="time-select">Duración del temporizador:</label>
                    <select id="time-select">
                        <option value="1">1 Minuto</option>
                        <option value="2" selected>2 Minutos</option>
                        <option value="3">3 Minutos</option>
                        <option value="4">4 Minutos</option>
                        <option value="5">5 Minutos</option>
                        <option value="6">6 Minutos</option>
                        <option value="7">7 Minutos</option>
                        <option value="8">8 Minutos</option>
                        <option value="9">9 Minutos</option>
                        <option value="10">10 Minutos</option>
                    </select>
                </div>
            </div>
            <button id="start-btn" class="btn-primary">¡EMPEZAR RONDA!</button>
            <br>
            <button id="test-audio-btn" class="audio-test-btn">🔊 Probar sonido de alarma</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen" class="card hidden">
            <div class="prompt-box">
                <span>Tenés que modelar:</span>
                <div id="prompt-text" class="prompt-text">---</div>
            </div>

            <div id="timer-display" class="timer-display">00:00</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="btn-group">
                <button id="pause-btn" class="btn-secondary">Pausar</button>
                <button id="change-prompt-btn" class="btn-outline">Cambiar Objeto</button>
                <button id="end-btn" class="btn-primary">Terminar</button>
            </div>

            <div id="vote-notice" class="vote-notice hidden">
                🔔 ¡TIEMPO FINALIZADO! 🔔<br>Manos arriba. ¡Muestren sus figuras y empiecen la votación!
            </div>
        </div>
    </div>

    <script>
        // Lista completa de 53 objetos y animales sencillos
        const consignas = [
            "Caracol", "Rana", "Perro", "Gato", "Cocodrilo", "Patito", "Auto", "Camioneta", "Árbol", 
            "Elefante", "Serpiente", "Pez", "Flor", "Manzana", "Banana", "Zapatilla", "Sombrero", 
            "Casa", "Sol", "Luna", "Estrella", "Helado", "Pizza", "Hueso", "Guitarra", "Pelota", 
            "Muñeco de nieve", "Mariposa", "Tortuga", "Lentes de sol", "Avión", "Barco", "Reloj", 
            "Taza de café", "Hamburguesa", "Cangrejo", "Pulpo", "Zapato", "Teléfono celular", 
            "Micrófono", "Lápiz", "Dinosaurio", "Oso", "Silla", "Mesa", "Llama / Alpaca", 
            "Corazón", "Cactus", "Botella", "Hongo", "Pájaro", "Avión de papel", "Tarta / Pastel"
        ];

        let totalTimeSeconds = 120;
        let timeRemaining = 120;
        let timerInterval = null;
        let isPaused = false;
        let audioCtx = null;

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const timeSelect = document.getElementById('time-select');
        const startBtn = document.getElementById('start-btn');
        const promptText = document.getElementById('prompt-text');
        const timerDisplay = document.getElementById('timer-display');
        const progressBar = document.getElementById('progress-bar');
        const pauseBtn = document.getElementById('pause-btn');
        const changePromptBtn = document.getElementById('change-prompt-btn');
        const endBtn = document.getElementById('end-btn');
        const voteNotice = document.getElementById('vote-notice');
        const testAudioBtn = document.getElementById('test-audio-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAlarmSound() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (idx * 0.15));

                gain.gain.setValueAtTime(0.3, now + (idx * 0.15));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.15) + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + (idx * 0.15));
                osc.stop(now + (idx * 0.15) + 0.3);
            });
        }

        testAudioBtn.addEventListener('click', () => {
            playAlarmSound();
        });

        function getRandomPrompt() {
            const randomIndex = Math.floor(Math.random() * consignas.length);
            return consignas[randomIndex];
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            const percentage = (timeRemaining / totalTimeSeconds) * 100;
            progressBar.style.width = `${percentage}%`;

            if (timeRemaining <= 30) {
                timerDisplay.classList.add('warning');
                progressBar.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
                progressBar.classList.remove('warning');
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            isPaused = false;
            pauseBtn.textContent = 'Pausar';

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeRemaining--;
                    updateTimerDisplay();

                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        endGame();
                    }
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            playAlarmSound();
            voteNotice.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            changePromptBtn.classList.add('hidden');
            endBtn.textContent = 'Nueva Ronda';
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            totalTimeSeconds = parseInt(timeSelect.value) * 60;
            timeRemaining = totalTimeSeconds;

            promptText.textContent = getRandomPrompt();
            voteNotice.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            changePromptBtn.classList.remove('hidden');
            endBtn.textContent = 'Terminar';

            updateTimerDisplay();
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            startTimer();
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Reanudar' : 'Pausar';
        });

        changePromptBtn.addEventListener('click', () => {
            promptText.textContent = getRandomPrompt();
        });

        endBtn.addEventListener('click', () => {
            if (endBtn.textContent === 'Nueva Ronda') {
                gameScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden');
            } else {
                endGame();
            }
        });
    </script>
</body>
</html>
