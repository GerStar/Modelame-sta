<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelame ésta - El Juego de Plastilina</title>
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #ba181b;
            --secondary: #457b9d;
            --accent: #ffb703;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #f1faee;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #0f3460;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8d99ae;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #e0e0e0;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #0f3460;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        .prompt-box {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        .prompt-box span {
            font-size: 0.85rem;
            color: #8d99ae;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .prompt-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1.2;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 900;
            font-family: monospace;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .timer-display.warning {
            color: var(--primary);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent);
            transition: width 1s linear, background-color 0.3s;
        }

        .progress-bar.warning {
            background: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #3a6b88;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #ccc;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        .hidden {
            display: none !important;
        }

            color: #8d99ae;
            border: none;
