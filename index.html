<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelame ésta - El Juego de Plastilina</title>
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #ba181b;
            --secondary: #457b9d;
            --accent: #ffb703;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #f1faee;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #0f3460;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8d99ae;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #e0e0e0;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #0f3460;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        .prompt-box {
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        .prompt-box span {
            font-size: 0.85rem;
            color: #8d99ae;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .prompt-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .image-container {
            width: 110px;
            height: 110px;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .image-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
        }

        .timer-display {
            font-size: 3.8rem;
            font-weight: 900;
            font-family: monospace;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .timer-display.warning {
            color: var(--primary);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent);
            transition: width 1s linear, background-color 0.3s;
        }

        .progress-bar.warning {
            background: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #3a6b88;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #ccc;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        .hidden {
            display: none !important;
        }

        .audio-test-btn {
            background: transparent;
            color: #8d99ae;
            border: none;
            font-size: 0.8rem;
            text-decoration: underline;
            margin-top: 15px;
            cursor: pointer;
        }

        .vote-notice {
            background: #2a9d8f;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Modelame ésta</h1>
        <p class="subtitle">¡Edición Cumpleaños de El Monch! 🎂</p>

        <!-- PANTALLA DE CONFIGURACIÓN -->
        <div id="setup-screen" class="card">
            <div class="selector-group">
                <div>
                    <label for="time-select">Duración del temporizador:</label>
                    <select id="time-select">
                        <option value="1">1 Minuto</option>
                        <option value="2" selected>2 Minutos</option>
                        <option value="3">3 Minutos</option>
                        <option value="4">4 Minutos</option>
                        <option value="5">5 Minutos</option>
                        <option value="6">6 Minutos</option>
                        <option value="7">7 Minutos</option>
                        <option value="8">8 Minutos</option>
                        <option value="9">9 Minutos</option>
                        <option value="10">10 Minutos</option>
                    </select>
                </div>
                <div>
                    <label for="mode-select">Modo de visualización:</label>
                    <select id="mode-select">
                        <option value="both" selected>Palabra + Dibujo 3D</option>
                        <option value="text">Solo Palabra</option>
                    </select>
                </div>
            </div>
            <button id="start-btn" class="btn-primary">¡EMPEZAR RONDA!</button>
            <br>
            <button id="test-audio-btn" class="audio-test-btn">🔊 Probar sonido de alarma</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen" class="card hidden">
            <div class="prompt-box">
                <span>Tenés que modelar:</span>
                <div id="prompt-text" class="prompt-text">---</div>
                <div id="image-container" class="image-container hidden"></div>
            </div>

            <div id="timer-display" class="timer-display">00:00</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="btn-group">
                <button id="pause-btn" class="btn-secondary">Pausar</button>
                <button id="change-prompt-btn" class="btn-outline">Cambiar Objeto</button>
                <button id="end-btn" class="btn-primary">Terminar</button>
            </div>

            <div id="vote-notice" class="vote-notice hidden">
                🔔 ¡TIEMPO FINALIZADO! 🔔<br>Manos arriba. ¡Muestren sus figuras y empiecen la votación!
            </div>
        </div>
    </div>

            { name: "Teléfono celular", svg: `<svg viewBox="0 0 100 100"><rect x="32" y="15" width="36" height="70" rx="8" fill="#2b2d42"/><rect x="37" y="22" width="26" height="50" rx="3" fill="#8d99ae"/><circle cx="50" cy="78" r="3" fill="#fff"/></svg>` },
            { name: "Micrófono", svg: `<svg viewBox="0 0 100 100"><rect x="44" y="55" width="12" height="25" rx="3" fill="#adb5bd"/><path d="M35 35 C35 20 65 20 65 35 L65 48 C65 63 35 63 35 48 Z" fill="#495057"/><path d="M32 40 Q25 40 25 55 Q25 65 40 68" fill="none" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/></svg>` },
            { name: "Lápiz", svg: `<svg viewBox="0 0 100 100"><polygon points="70,20 80,30 40,70 30,60" fill="#ffb703"/><polygon points="30,60 40,70 20,80" fill="#fefae0"/><polygon points="20,80 25,75 25,75" fill="#2b2d42"/><rect x="65" y="15" width="15" height="15" rx="3" fill="#e63946"/></svg>` },
            { name: "Dinosaurio", svg: `<svg viewBox="0 0 100 100"><path d="M30 75 L30 55 Q30 35 45 35 L60 45 L75 55 L85 65 L85 75 Z" fill="#52b788"/><circle cx="55" cy="30" r="10" fill="#52b788"/><circle cx="58" cy="28" r="2" fill="#000"/><path d="M25 75 L20 85 M35 75 L33 85 M75 75 L73 85 M82 75 L84 85" stroke="#2d6a4f" stroke-width="5" stroke-linecap="round"/></svg>` },
            { name: "Oso", svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="28" fill="#bc6c25"/><circle cx="32" cy="35" r="12" fill="#bc6c25"/><circle cx="68" cy="35" r="12" fill="#bc6c25"/><circle cx="50" cy="62" r="12" fill="#dda15e"/><circle cx="42" cy="48" r="4" fill="#283618"/><circle cx="58" cy="48" r="4" fill="#283618"/><circle cx="50" cy="58" r="4" fill="#283618"/></svg>` },
            { name: "Silla", svg: `<svg viewBox="0 0 100 100"><rect x="35" y="25" width="30" height="35" rx="3" fill="#dda15e"/><rect x="30" y="60" width="40" height="8" rx="2" fill="#bc6c25"/><rect x="33" y="68" width="6" height="20" fill="#8d99ae"/><rect x="61" y="68" width="6" height="20" fill="#8d99ae"/></svg>` },
            { name: "Mesa", svg: `<svg viewBox="0 0 100 100"><rect x="15" y="35" width="70" height="10" rx="3" fill="#dda15e"/><rect x="22" y="45" width="6" height="35" fill="#bc6c25"/><rect x="72" y="45" width="6" height="35" fill="#bc6c25"/></svg>` },
            { name: "Llama / Alpaca", svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="22" ry="16" fill="#fefae0"/><path d="M60 45 L65 20 L55 35 Z" fill="#fefae0"/><circle cx="65" cy="20" r="8" fill="#fefae0"/><circle cx="68" cy="18" r="2" fill="#000"/><path d="M35 75 L30 88 M65 75 L70 88" stroke="#bc6c25" stroke-width="5" stroke-linecap="round"/></svg>` },
            { name: "Corazón", svg: `<svg viewBox="0 0 100 100"><path d="M50 30 Q35 10 20 30 Q5 50 50 85 Q95 50 80 30 Q65 10 50 30 Z" fill="#e63946"/></svg>` },
            { name: "Cactus", svg: `<svg viewBox="0 0 100 100"><rect x="42" y="30" width="16" height="55" rx="8" fill="#2a9d8f"/><path d="M30 45 L30 35 Q30 30 38 30 L42 30" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/><path d="M58 55 L70 55 Q75 55 75 48 L75 45" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/></svg>` },
            { name: "Botella", svg: `<svg viewBox="0 0 100 100"><rect x="42" y="15" width="16" height="15" rx="2" fill="#457b9d"/><path d="M35 30 L65 30 L70 82 L30 82 Z" fill="#a8dadc"/></svg>` },
            { name: "Hongo", svg: `<svg viewBox="0 0 100 100"><path d="M25 45 Q50 15 75 45 Z" fill="#e63946"/><circle cx="40" cy="32" r="5" fill="#fff"/><circle cx="60" cy="35" r="4" fill="#fff"/><rect x="44" y="45" width="12" height="40" rx="4" fill="#fefae0"/></svg>` },
            { name: "Pájaro", svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#4cc9f0"/><circle cx="62" cy="42" r="5" fill="#fff"/><circle cx="64" cy="42" r="2" fill="#000"/><polygon points="68,45 80,48 68,52" fill="#ffb703"/><path d="M30 60 Q20 75 10 65" stroke="#f72585" stroke-width="4" fill="none"/></svg>` },
            { name: "Avión de papel", svg: `<svg viewBox="0 0 100 100"><polygon points="20,70 80,70 50,25" fill="#fefae0"/><polygon points="50,25 80,70 65,85" fill="#ced4da"/><polygon points="20,70 50,25 35,85" fill="#adb5bd"/></svg>` },
            { name: "Tarta / Pastel", svg: `<svg viewBox="0 0 100 100"><rect x="25" y="45" width="50" height="35" rx="4" fill="#ff70a6"/><rect x="20" y="35" width="60" height="12" rx="4" fill="#fefae0"/><rect x="47" y="20" width="6" height="15" fill="#ffb703"/><circle cx="50" cy="16" r="4" fill="#e63946"/></svg>` }
        ];

        let totalTimeSeconds = 120;
        let timeRemaining = 120;
        let timerInterval = null;
        let isPaused = false;
        let audioCtx = null;
        let currentMode = "both";

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const timeSelect = document.getElementById('time-select');
        const modeSelect = document.getElementById('mode-select');
        const startBtn = document.getElementById('start-btn');
        const promptText = document.getElementById('prompt-text');
        const imageContainer = document.getElementById('image-container');
        const timerDisplay = document.getElementById('timer-display');
        const progressBar = document.getElementById('progress-bar');
        const pauseBtn = document.getElementById('pause-btn');
        const changePromptBtn = document.getElementById('change-prompt-btn');
        const endBtn = document.getElementById('end-btn');
        const voteNotice = document.getElementById('vote-notice');
        const testAudioBtn = document.getElementById('test-audio-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAlarmSound() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (idx * 0.15));

                gain.gain.setValueAtTime(0.3, now + (idx * 0.15));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.15) + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + (idx * 0.15));
                osc.stop(now + (idx * 0.15) + 0.3);
            });
        }

        testAudioBtn.addEventListener('click', () => {
            playAlarmSound();
        });

        function getRandomPrompt() {
            const randomIndex = Math.floor(Math.random() * consignas.length);
            return consignas[randomIndex];
        }

        function displayPrompt(item) {
            promptText.textContent = item.name;

            if (currentMode === "both") {
                imageContainer.innerHTML = item.svg;
                imageContainer.classList.remove('hidden');
            } else {
                imageContainer.classList.add('hidden');
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            const percentage = (timeRemaining / totalTimeSeconds) * 100;
            progressBar.style.width = `${percentage}%`;

            if (timeRemaining <= 30) {
                timerDisplay.classList.add('warning');
                progressBar.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
                progressBar.classList.remove('warning');
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            isPaused = false;
            pauseBtn.textContent = 'Pausar';

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeRemaining--;
                    updateTimerDisplay();

                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        endGame();
                    }
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            playAlarmSound();
            voteNotice.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            changePromptBtn.classList.add('hidden');
            endBtn.textContent = 'Nueva Ronda';
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            totalTimeSeconds = parseInt(timeSelect.value) * 60;
            timeRemaining = totalTimeSeconds;
            currentMode = modeSelect.value;

            displayPrompt(getRandomPrompt());
            voteNotice.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            changePromptBtn.classList.remove('hidden');
            endBtn.textContent = 'Terminar';

            updateTimerDisplay();
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            startTimer();
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Reanudar' : 'Pausar';
        });

        changePromptBtn.addEventListener('click', () => {
            displayPrompt(getRandomPrompt());
        });

        endBtn.addEventListener('click', () => {
            if (endBtn.textContent === 'Nueva Ronda') {
                gameScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden');
            } else {
                endGame();
            }
        });
    </script>
</body>
